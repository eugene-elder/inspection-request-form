<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Inspection Request Form</title>
<style>
body{font-family:Segoe UI,Arial,sans-serif;background:#fff;color:#000;margin:0;padding:24px}
.wrap{max-width:820px;margin:auto}
header{position:relative;text-align:center;border-bottom:2px solid #000;padding-bottom:12px}
header img{max-height:160px}
#dt{position:absolute;top:0;right:0;text-align:left;width:170px}
h1{margin:10px 0 0;font-size:1.8em}
fieldset{border:1px solid #000;border-radius:6px;margin-top:20px;padding:12px 18px 18px}
legend{font-weight:700;font-size:1.1em;padding:0 6px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px 14px}
.c1{grid-column:span 1}.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}
label{display:block;font-weight:600;font-size:.88em;margin-bottom:3px}
input,textarea{width:100%;box-sizing:border-box;padding:7px;border:1px solid #000;border-radius:4px;font-size:1em;background:#fff;color:#000}
textarea{min-height:130px}
.btns{margin-top:20px;display:flex;gap:10px;position:sticky;bottom:0;background:#fff;padding:10px 0;border-top:1px solid #000}
button{padding:9px 16px;border:1px solid #000;border-radius:4px;background:#000;color:#fff;font-size:1em;cursor:pointer}
button.sec{background:#fff;color:#000}
@page{size:letter;margin:0.5in}
@media print{.btns{display:none}body{padding:0}fieldset{break-inside:avoid}input,textarea{border:1px solid #000}textarea{min-height:90px}header img{max-height:80px}h1{font-size:1.4em;margin-top:4px}fieldset{margin-top:10px;padding:6px 12px 10px}.grid{gap:6px 12px}input{padding:4px}label{font-size:.8em}textarea{min-height:70px}td{padding:1px 2px}header img{max-height:65px}body{font-size:13px}}
td{padding:3px 2px;border-bottom:1px solid #ccc}
/*NB*/textarea[name=Notes]{min-height:280px}.pt{flex:1}@media print{textarea[name=Notes]{min-height:150px}td{padding:0 2px!important}td input{padding:0 3px!important;font-size:.9em}.pt{font-size:.8em!important}}/*NE*/</style></head><body><div class="wrap">

<script>
function nm(){const f=document.getElementById('f');return 'inspection_'+((f.elements['First name'].value||'')+(f.elements['Last name'].value||'')).replace(/[^a-z0-9]+/gi,'');}
function save(){const d=new FormData(document.getElementById('f'));let t='Inspection Request - '+new Date().toLocaleString()+'\n\n';
for(const [k,v] of d.entries())t+=k+': '+v+'\n';
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download=nm()+'.txt';a.click();}
function pdf(){const o=document.title;document.title=nm();window.print();setTimeout(()=>document.title=o,1000);}
let sv=false;document.querySelectorAll('.btns button:not([type=reset])').forEach(b=>b.addEventListener('click',()=>sv=true));
window.addEventListener('beforeunload',e=>{if(sv)return;const f=document.getElementById('f');for(const el of f.elements){if((el.type==='checkbox'||el.type==='radio')?el.checked!==el.defaultChecked:(el.value!==undefined&&el.defaultValue!==undefined&&el.value!==el.defaultValue)){e.preventDefault();e.returnValue='You have unsaved changes';return 'You have unsaved changes';}}});
</script><script>
(function(){var t=document.querySelector('table.pt').closest('fieldset'),ip=document.querySelector('input[name="Inspection Price"]');
function num(v){v=String(v||'').replace(/[^0-9.]/g,'');return v?parseFloat(v):0;}
function sum(){var x=0;t.querySelectorAll('input[type=checkbox],input[type=radio]').forEach(function(c){if(c.checked){var p=c.closest('tr').querySelector('input[name^="Price: "]');x+=num(p&&p.value);}});ip.value=x?('$'+x.toLocaleString('en-US')):'';}
t.querySelectorAll('input[type=checkbox],input[type=radio]').forEach(function(c){c.addEventListener('change',sum);});})();
</script>
<script>
(function(){var f=['Year','Make','Model'].map(function(n){return document.querySelector('input[name="'+n+'"]');}),b=document.getElementById('fpbtn');
function chk(){b.disabled=!f.every(function(i){return i.value.trim();});}
f.forEach(function(i){i.addEventListener('input',chk);});document.getElementById('f').addEventListener('reset',function(){setTimeout(chk,0);});
window.fp=function(){var q=f.map(function(i){return i.value.trim();}).join(' ');
window.open('https://duckduckgo.com/?q='+encodeURIComponent('\\ site:nationalvehicle.com '+q+' floor plan'),'_blank');};})();
</script>
<style>button#fpbtn,button#fpbtn:disabled{background:#1e5631 !important;color:#fff !important;border-color:#1e5631 !important}#fpbtn:disabled{opacity:.55;cursor:not-allowed}</style>
<script>(function(){var d=document.querySelector('input[name="Date"]');function t(){if(d&&!d.value){var n=new Date();d.value=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');}}t();document.getElementById('f').addEventListener('reset',function(){setTimeout(t,0);});})();</script>
